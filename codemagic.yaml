# Codemagic workflow for Pocket Wallet: builds an UNSIGNED .ipa (no Apple
# Developer account or certificates needed on Codemagic).
#
# Setup in Codemagic:
#  1. Add the repo and choose "codemagic.yaml" as the configuration.
#  2. Environment variables > create a group named "supabase" with:
#       SUPABASE_URL                 e.g. https://abcd1234.supabase.co
#       SUPABASE_PUBLISHABLE_KEY     sb_publishable_...
#  3. Start the "ios-unsigned-ipa" workflow and download the .ipa artifact.
#
# Install the .ipa on your iPhone with a sideloading tool that signs it with
# your free Apple ID (Sideloadly, AltStore, or Xcode on a Mac). Free-signed apps
# expire after 7 days and must be re-signed.

workflows:
  ios-unsigned-ipa:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups:
        - supabase
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Prepare iOS (Podfile + deployment target)
        script: |
          set -e
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          # Read the minimum iOS version the installed Flutter engine requires.
          MIN=$(grep -o "deployment_target *= *'[0-9.]*'" \
            "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.podspec" \
            | grep -o "[0-9][0-9.]*" | head -1)
          MIN=${MIN:-15.0}
          echo "Using iOS deployment target $MIN"
          # Generates ios/Podfile if the repo does not have one.
          flutter build ios --config-only --release --no-codesign || true
          cd ios
          if [ -f Podfile ]; then
            sed -i '' -E "s/^#? *platform :ios, .*/platform :ios, '$MIN'/" Podfile
            grep -n "platform :ios" Podfile
          fi
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = $MIN;/g" Runner.xcodeproj/project.pbxproj
          sed -i '' -E "/MinimumOSVersion/{n;s/<string>[0-9.]+<\/string>/<string>$MIN<\/string>/;}" Flutter/AppFrameworkInfo.plist || true
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Build iOS app (no codesign)
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
      - name: Package unsigned .ipa
        script: |
          set -e
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -qry PocketWallet-unsigned.ipa Payload
          rm -rf Payload
          ls -lh PocketWallet-unsigned.ipa
    artifacts:
      - build/ipa/PocketWallet-unsigned.ipa
